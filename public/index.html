<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logos.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Vishnu Nair — Software Development Engineer / Full Stack Developer in Bengaluru. React, Next.js, Java Spring Boot, Node.js. Projects, work experience and resume."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logos.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <script>
      /*
       * Prevent a flash of the wrong theme (FOUC).
       * Runs before React mounts so <html> already carries the `dark` class on
       * first paint. Mirrors the logic in src/utils/theme.js.
       */
      (function () {
        try {
          var stored = localStorage.getItem("vn-theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored ? stored === "dark" : prefersDark;
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0b1120" : "#ffffff");
        } catch (e) {
          /* storage unavailable — stay in light mode */
        }
      })();
    </script>

    <title>Vishnu Nair | Software Development Engineer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
